<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тех. режим | BRAZZERS</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--g:#16a34a;--g2:#15803d;--g100:#dcfce7;--g50:#f0fdf4;--gray:#111;--b:#bbf7d0;--bulldozer:#f59e0b;--caravan:#4ade80;--newland:#3b82f6}
        body{background:var(--g50);color:var(--gray);font-family:Arial,sans-serif;padding:15px;min-height:100vh}
        .h{display:flex;justify-content:space-between;margin-bottom:25px;padding-bottom:12px;border-bottom:2px solid var(--g);flex-wrap:wrap;gap:10px}
        .h h1{color:var(--g2)}
        .btn{background:var(--g);color:white;border:0;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600}
        .btn:hover{background:var(--g2)}
        .btn-red{background:#ef4444}
        .btn-red:hover{background:#dc2626}
        .section{background:var(--g50);padding:18px;border-radius:12px;margin-bottom:20px;border:1px solid var(--b)}
        table{width:100%;border-collapse:collapse;margin:12px 0}
        th,td{padding:8px;text-align:center;border:1px solid var(--b)}
        th{background:var(--g100)}
        input,select,textarea{width:100%;padding:8px;margin:4px 0;border:1px solid var(--b);border-radius:4px}
        
        /* Тёмная тема */
        body.dark{background:#0f172a;color:#e2e8f0}
        body.dark .h{border-color:#4ade80}
        body.dark .h h1{color:#4ade80}
        body.dark .btn{background:#4ade80;color:#0f172a}
        body.dark .btn-red{background:#ef4444;color:white}
        body.dark .section{background:rgba(74,222,128,0.1);border-color:#4ade80}
        body.dark th,body.dark td{border-color:#4ade80}
        body.dark th{background:rgba(74,222,128,0.15)}
        body.dark input,body.dark select,body.dark textarea{border-color:#4ade80;background:rgba(30,41,59,0.8);color:#e2e8f0}
        
        .row{display:flex;gap:8px;margin-top:8px}
        .col{flex:1}
    </style>
</head>
<body>
    <div class="h">
        <h1>ТЕХ. РЕЖИМ (admin2)</h1>
        <div style="display:flex;gap:8px">
            <button class="btn" onclick="location.href='dashboard.html'">← Назад</button>
            <button class="btn" onclick="toggleTheme()">🌓</button>
            <button class="btn btn-red" onclick="logout()">🚪 Выйти</button>
        </div>
    </div>
    
    <div class="section">
        <h2>Создать пользователя</h2>
        <div class="row">
            <input id="newUsername" placeholder="Никнейм" class="col">
            <input id="newLogin" placeholder="Логин" class="col">
            <input id="newPassword" placeholder="Пароль" class="col">
        </div>
        <button class="btn" onclick="createUser()" style="margin-top:8px">Создать</button>
    </div>
    
    <div class="section">
        <h2>Удалить пользователя</h2>
        <select id="deleteUser"><option value="">Выберите пользователя</option></select>
        <button class="btn btn-red" onclick="deleteUser()" style="margin-top:8px">Удалить</button>
    </div>
    
    <div class="section">
        <h2>Назначить админа</h2>
        <select id="promoteUser"><option value="">Выберите пользователя (роль: user)</option></select>
        <button class="btn" onclick="promoteToAdmin()" style="margin-top:8px">Сделать админом</button>
    </div>
    
    <div class="section">
        <h2>Снять админа</h2>
        <select id="demoteUser"><option value="">Выберите админа</option></select>
        <button class="btn btn-red" onclick="demoteAdmin()" style="margin-top:8px">Снять админа</button>
    </div>
    
    <div class="section">
        <h2>Логины пользователей</h2>
        <div id="usersTable" style="max-height:300px;overflow-y:auto">Загрузка...</div>
        <p style="color:#ef4444;margin-top:10px">⚠️ Пароли не отображаются</p>
    </div>
    
    <div class="section">
        <h2>Аудит-логи</h2>
        <div id="auditLogs" style="max-height:300px;overflow-y:auto">Загрузка...</div>
    </div>
    
    <div class="section">
        <h2>Заявки на смену учётных данных</h2>
        <div id="changeRequests">Загрузка...</div>
    </div>
    
    <div class="section">
        <h2>Изменить логин/пароль</h2>
        <select id="changeUser"><option value="">Выберите пользователя</option></select>
        <div class="row">
            <input id="adminNewLogin" placeholder="Новый логин" class="col">
            <button class="btn" onclick="adminChangeLogin()" style="margin-top:8px">Сменить логин</button>
        </div>
        <div class="row">
            <input id="adminNewPassword" placeholder="Новый пароль" class="col">
            <button class="btn btn-red" onclick="adminChangePassword()" style="margin-top:8px">Сменить пароль</button>
        </div>
    </div>
    
    <div class="section">
        <h2>Новости</h2>
        <textarea id="newsMessage" placeholder="Введите сообщение..." style="height:100px"></textarea>
        <button class="btn" onclick="postNews()" style="margin-top:8px">Опубликовать</button>
    </div>
    
    <script>
    const SU = 'https://qjgzhtkpwamounnpgepr.supabase.co';
    const SK = 'sb_publishable_WV7YnhP_OAWYx8gQjOmG1Q_7GdKOVlV';
    const CH = ['chunk1','chunk2','chunk3','chunk4','chunk5','chunk6','chunk7','chunk8','vr1','vr2','vr3','core'];
    let supabaseClient = null;
    
    function init() {
        console.log('🔧 Тех. режим загружен');
        if (typeof supabase === 'undefined') { setTimeout(init, 50); return; }
        
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
        
        const user = JSON.parse(localStorage.getItem('session'));
        if (!user || user.role !== 'admin2') { location.href = 'login.html'; return; }
        
        supabaseClient = supabase.createClient(SU, SK);
        loadAll();
    }
    
    async function loadAll() {
        console.log('Загрузка данных...');
        try {
            const { data: users, error: usersErr } = await supabaseClient.from('users').select('*');
            if (usersErr) console.error('Ошибка users:', usersErr);
            
            const { data: audit, error: auditErr } = await supabaseClient.from('audit_log').select('*').order('timestamp', { ascending: false }).limit(50);
            if (auditErr) console.error('Ошибка audit:', auditErr);
            
            console.log('Загружаю change_requests...');
            let changes = null;
            try {
                const result = await supabaseClient.from('change_requests').select('*').eq('status', 'pending');
                if (result.error) {
                    console.error('Ошибка changes:', result.error);
                } else {
                    changes = result.data;
                    console.log('Changes:', changes);
                }
            } catch (e) {
                console.error('Исключение changes:', e);
            }
            
            // Заполняем селекты
            let delSel = document.getElementById('deleteUser');
            let proSel = document.getElementById('promoteUser');
            let demSel = document.getElementById('demoteUser');
            let chgSel = document.getElementById('changeUser');
            
            delSel.innerHTML = '<option value="">Выберите</option>';
            proSel.innerHTML = '<option value="">Выберите (user)</option>';
            demSel.innerHTML = '<option value="">Выберите (admin)</option>';
            chgSel.innerHTML = '<option value="">Выберите</option>';
            
            let table = '<table><tr><th>Никнейм</th><th>Логин</th><th>Роль</th></tr>';
            for (let u of (users || [])) {
                delSel.innerHTML += '<option value="'+u.id+'">'+u.username+' ('+u.login+')</option>';
                if (u.role === 'user') proSel.innerHTML += '<option value="'+u.id+'">'+u.username+' ('+u.login+')</option>';
                if (u.role === 'admin') demSel.innerHTML += '<option value="'+u.id+'">'+u.username+' ('+u.login+')</option>';
                chgSel.innerHTML += '<option value="'+u.id+'">'+u.username+' ('+u.login+')</option>';
                table += '<tr><td>'+u.username+'</td><td>'+u.login+'</td><td>'+u.role+'</td></tr>';
            }
            table += '</table>';
            document.getElementById('usersTable').innerHTML = table;
            
            // Аудит
            let auditHtml = '<table><tr><th>Время</th><th>Действие</th><th>Детали</th></tr>';
            for (let a of (audit || [])) {
                auditHtml += '<tr><td>'+(a.timestamp||'').slice(0,16)+'</td><td>'+a.action+'</td><td>'+(a.details||'')+'</td></tr>';
            }
            auditHtml += '</table>';
            document.getElementById('auditLogs').innerHTML = auditHtml;
            
            // Изменения
            let changeHtml = '';
            if (!changes || !Array.isArray(changes) || changes.length === 0) {
                changeHtml = 'Нет заявок';
            } else {
                for (let c of changes) {
                    changeHtml += '<div style="background:white;padding:12px;border-radius:8px;margin:8px 0">';
                    changeHtml += '<strong>Пользователь ID: ' + c.user_id + '</strong>';
                    if (c.new_login) changeHtml += '<br>Новый логин: ' + c.new_login;
                    changeHtml += '<br><button class="btn" onclick="approveChange(' + c.id + ')">Одобрить</button> ';
                    changeHtml += '<button class="btn btn-red" onclick="rejectChange(' + c.id + ')">Отклонить</button>';
                    changeHtml += '</div>';
                }
            }
            document.getElementById('changeRequests').innerHTML = changeHtml;
            
            console.log('Данные загружены успешно');
        } catch (e) {
            console.error('Ошибка loadAll:', e);
        }
    }
    
    async function createUser() {
        console.log('Создание пользователя...');
        const username = document.getElementById('newUsername').value;
        const login = document.getElementById('newLogin').value;
        const password = document.getElementById('newPassword').value;
        if (!username || !login || !password) return alert('Заполните все поля!');
        
        try {
            const hash = btoa(password);
            console.log('Хеш пароля:', hash);
            
            const { error } = await supabaseClient.from('users').insert({ 
                username, 
                login, 
                password_hash: hash, 
                role: 'user' 
            });
            
            if (error) {
                console.error('Ошибка создания пользователя:', error);
                alert('Ошибка: ' + error.message);
                return;
            }
            
            console.log('Пользователь создан, добавляю в аудит...');
            
            const user = JSON.parse(localStorage.getItem('session'));
            await supabaseClient.from('audit_log').insert({ 
                admin_id: user.id, 
                action: 'create_user', 
                details: 'login=' + login 
            });
            
            console.log('Аудит записан');
            
            document.getElementById('newUsername').value = '';
            document.getElementById('newLogin').value = '';
            document.getElementById('newPassword').value = '';
            
            console.log('✅ Пользователь ' + login + ' успешно создан!');
            loadAll();
        } catch (e) {
            console.error('Ошибка:', e);
            alert('Ошибка: ' + e.message);
        }
    }
    
    async function deleteUser() {
        console.log('Удаление пользователя...');
        const id = document.getElementById('deleteUser').value;
        if (!id) return;
        if (!confirm('Удалить пользователя и все его данные?')) return;
        
        const { data: delUser } = await supabaseClient.from('users').select('username,login').eq('id', id).single();
        
        await supabaseClient.from('users').delete().eq('id', id);
        await supabaseClient.from('stats').delete().eq('user_id', id);
        
        const user = JSON.parse(localStorage.getItem('session'));
        await supabaseClient.from('audit_log').insert({ 
            admin_id: user.id, 
            action: 'delete_user', 
            details: 'login=' + delUser.login 
        });
        
        console.log('✅ Пользователь удалён');
        loadAll();
    }
    
    async function promoteToAdmin() {
        console.log('Повышение до админа...');
        const id = document.getElementById('promoteUser').value;
        if (!id) return;
        
        const { data: targetUser } = await supabaseClient.from('users').select('username,login').eq('id', id).single();
        await supabaseClient.from('users').update({ role: 'admin' }).eq('id', id).eq('role', 'user');
        
        const user = JSON.parse(localStorage.getItem('session'));
        await supabaseClient.from('audit_log').insert({ 
            admin_id: user.id, 
            action: 'promote_user', 
            details: 'login=' + targetUser.login 
        });
        
        console.log('✅ Пользователь повышен до админа');
        loadAll();
    }
    
    async function demoteAdmin() {
        console.log('Снятие админа...');
        const id = document.getElementById('demoteUser').value;
        if (!id) return;
        
        const { data: targetUser } = await supabaseClient.from('users').select('username,login').eq('id', id).single();
        await supabaseClient.from('users').update({ role: 'user' }).eq('id', id);
        
        const user = JSON.parse(localStorage.getItem('session'));
        await supabaseClient.from('audit_log').insert({ 
            admin_id: user.id, 
            action: 'demote_user', 
            details: 'login=' + targetUser.login 
        });
        
        console.log('✅ Админ снят');
        loadAll();
    }
    
    async function adminChangeLogin() {
        console.log('Смена логина...');
        const id = document.getElementById('changeUser').value;
        const newLogin = document.getElementById('adminNewLogin').value;
        if (!id || !newLogin) return;
        await supabaseClient.from('users').update({ login: newLogin }).eq('id', id);
        console.log('✅ Логин изменён');
        document.getElementById('adminNewLogin').value = '';
        loadAll();
    }
    
    async function adminChangePassword() {
        console.log('Смена пароля...');
        const id = document.getElementById('changeUser').value;
        const newPass = document.getElementById('adminNewPassword').value;
        if (!id || !newPass) return;
        
        const hash = btoa(newPass);
        await supabaseClient.from('users').update({ password_hash: hash }).eq('id', id);
        
        console.log('✅ Пароль изменён и захеширован');
        document.getElementById('adminNewPassword').value = '';
    }
    
    async function approveChange(id) {
        const { data: req } = await supabaseClient.from('change_requests').select('*').eq('id', id).single();
        if (req.new_login) await supabaseClient.from('users').update({ login: req.new_login }).eq('id', req.user_id);
        await supabaseClient.from('change_requests').update({ status: 'approved' }).eq('id', id);
        location.reload();
    }
    
    async function rejectChange(id) {
        await supabaseClient.from('change_requests').update({ status: 'rejected' }).eq('id', id);
        location.reload();
    }
    
    async function postNews() {
        console.log('Публикация новости...');
        const user = JSON.parse(localStorage.getItem('session'));
        const msg = document.getElementById('newsMessage').value;
        if (!msg) return;
        
        await supabaseClient.from('news').insert({ author_id: user.id, message: msg, role: user.role });
        
        console.log('✅ Новость опубликована');
        document.getElementById('newsMessage').value = '';
    }
    
    function toggleTheme() {
        document.body.classList.toggle('dark');
        localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }
    
    function logout() { localStorage.removeItem('session'); location.href = 'login.html'; }
    
    window.onload = init;
    </script>
</body>
</html>
