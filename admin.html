<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | BRAZZERS</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--g:#16a34a;--g2:#15803d;--g100:#dcfce7;--g50:#f0fdf4;--gray:#111;--b:#bbf7d0}
        body{background:#f0fdf4;color:var(--gray);font-family:Arial,sans-serif;min-height:100vh;padding:15px}
        body.dark{background:#0f172a;color:#e2e8f0}
        .h{display:flex;justify-content:space-between;margin-bottom:25px;padding-bottom:12px;border-bottom:2px solid var(--g);flex-wrap:wrap;gap:10px}
        .btn{background:var(--g);color:white;border:0;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600}
        .section{background:var(--g50);padding:18px;border-radius:12px;margin-bottom:20px;border:1px solid var(--b)}
        body.dark .section{background:rgba(74,222,128,0.1);border-color:#4ade80}
        body.dark .h{border-color:#4ade80}
        body.dark .btn{background:#4ade80;color:#0f172a}
        table{width:100%;border-collapse:collapse}
        th,td{padding:8px;text-align:center;border:1px solid var(--b)}
        body.dark th,body.dark td{border-color:#4ade80}
        th{background:var(--g100)}
        body.dark th{background:rgba(74,222,128,0.15)}
        input,select,textarea{width:100%;padding:8px;margin:4px 0;border:1px solid var(--b);border-radius:4px}
    </style>
</head>
<body>
    <div class="h">
        <h1>АДМИН-ПАНЕЛЬ</h1>
        <div>
            <button onclick="location.href='dashboard.html'">← Назад</button>
            <button onclick="logout()">Выйти</button>
        </div>
    </div>
    <div class="section">
        <h2>Запросы на куски</h2>
        <div id="chunkRequests">Загрузка...</div>
    </div>
    <div class="section">
        <h2>Запросы на смену данных</h2>
        <div id="changeRequests">Загрузка...</div>
    </div>
    <div class="section">
        <h2>Пользователи</h2>
        <div id="users">Загрузка...</div>
    </div>
    <script>
    const SU = 'https://qjgzhtkpwamounnpgepr.supabase.co';
    const SK = 'sb_publishable_WV7YnhP_OAWYx8gQjOmG1Q_7GdKOVlV';
    const CH = ['chunk1','chunk2','chunk3','chunk4','chunk5','chunk6','chunk7','chunk8','vr1','vr2','vr3','core'];
    
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
    
    function init() {
        if (typeof supabase === 'undefined') { setTimeout(init, 50); return; }
        const s = supabase.createClient(SU, SK);
        const user = JSON.parse(localStorage.getItem('session'));
        if (!user || user.role !== 'admin') { location.href = 'login.html'; return; }
        
        loadRequests(s);
    }
    
    async function loadRequests(s) {
        const { data: chunkReqs } = await s.from('chunk_requests').select('*,users(username)').eq('status', 'pending');
        let h = '';
        if (!chunkReqs || chunkReqs.length === 0) h = 'Нет запросов';
        for (let req of chunkReqs) {
            h += '<div style="padding:8px;margin:4px 0;background:white;border-radius:4px">';
            h += req.users?.username || 'Unknown';
            h += ' хочет ' + req.chunk_name;
            h += ' <button onclick="approveChunk('+req.id+')">Выдать</button>';
            h += ' <button onclick="rejectChunk('+req.id+')">Отказ</button>';
            h += '</div>';
        }
        document.getElementById('chunkRequests').innerHTML = h;
        
        const { data: changeReqs } = await s.from('change_requests').select('*,users(username)').eq('status', 'pending');
        let h2 = '';
        if (!changeReqs || changeReqs.length === 0) h2 = 'Нет запросов';
        for (let req of changeReqs) {
            h2 += '<div style="padding:8px;margin:4px 0;background:white;border-radius:4px">';
            h2 += req.users?.username || 'Unknown';
            if (req.new_login) h2 += ' хочет логин: ' + req.new_login;
            h2 += ' <button onclick="approveChange('+req.id+')">Одобрить</button>';
            h2 += ' <button onclick="rejectChange('+req.id+')">Отказ</button>';
            h2 += '</div>';
        }
        document.getElementById('changeRequests').innerHTML = h2;
        
        const { data: users } = await s.from('users').select('*');
        let h3 = '<table><tr><th>Ник</th><th>Логин</th><th>Роль</th></tr>';
        for (let u of (users || [])) {
            h3 += '<tr><td>'+u.username+'</td><td>'+u.login+'</td><td>'+u.role+'</td></tr>';
        }
        h3 += '</table>';
        document.getElementById('users').innerHTML = h3;
    }
    
    async function approveChunk(id) {
        const s = supabase.createClient(SU, SK);
        const { data: req } = await s.from('chunk_requests').select('*').eq('id', id).single();
        await s.from('issued_chunks').insert({ user_id: req.user_id, chunk_name: req.chunk_name });
        await s.from('chunk_requests').update({ status: 'approved' }).eq('id', id);
        location.reload();
    }
    
    async function rejectChunk(id) {
        const s = supabase.createClient(SU, SK);
        const { data: req } = await s.from('chunk_requests').select('*').eq('id', id).single();
        let vals = {}; for (let c of CH) vals[c] = 0;
        vals[req.chunk_name] = 100;
        await s.from('stats').insert({ user_id: req.user_id, ...vals });
        await s.from('chunk_requests').update({ status: 'rejected' }).eq('id', id);
        location.reload();
    }
    
    async function approveChange(id) {
        const s = supabase.createClient(SU, SK);
        const { data: req } = await s.from('change_requests').select('*').eq('id', id).single();
        if (req.new_login) await s.from('users').update({ login: req.new_login }).eq('id', req.user_id);
        await s.from('change_requests').update({ status: 'approved' }).eq('id', id);
        location.reload();
    }
    
    async function rejectChange(id) {
        const s = supabase.createClient(SU, SK);
        await s.from('change_requests').update({ status: 'rejected' }).eq('id', id);
        location.reload();
    }
    
    function logout() { localStorage.removeItem('session'); location.href = 'login.html'; }
    
    window.onload = init;
    </script>
</body>
</html>
