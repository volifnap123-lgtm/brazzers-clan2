<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель нитей | BRAZZERS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧵</text></svg>">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--g:#3b82f6;--g2:#2563eb;--g100:#dbeafe;--g50:#eff6ff;--gray:#111;--b:#bfdbfe}
        
        ::-webkit-scrollbar{width:10px;height:10px}
        ::-webkit-scrollbar-track{background:rgba(0,0,0,0.1);border-radius:5px}
        ::-webkit-scrollbar-thumb{background:var(--g);border-radius:5px}
        
        body{background:var(--g50);color:var(--gray);font-family:Arial,sans-serif;min-height:100vh;padding:15px}
        body.dark{background:#0f172a;color:#e2e8f0}
        .h{display:flex;justify-content:space-between;margin-bottom:25px;padding-bottom:12px;border-bottom:2px solid var(--g);flex-wrap:wrap;gap:10px}
        .h h1{color:var(--g2)}
        .btn{background:var(--g);color:white;border:0;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600}
        .btn:hover{background:var(--g2)}
        .btn-red{background:#ef4444}
        .btn-red:hover{background:#dc2626}
        .section{background:var(--g50);padding:18px;border-radius:12px;margin-bottom:20px;border:1px solid var(--b)}
        body.dark .section{background:rgba(59,130,246,0.15);border-color:#3b82f6}
        body.dark .h{border-color:#3b82f6}
        body.dark .h h1{color:#3b82f6}
        body.dark .btn{background:#3b82f6;color:white}
        table{width:100%;border-collapse:collapse;margin:12px 0}
        th,td{padding:8px;text-align:center;border:1px solid var(--b)}
        body.dark th,body.dark td{border-color:#3b82f6}
        th{background:var(--g100)}
        body.dark th{background:rgba(59,130,246,0.2)}
        input,select,textarea{width:100%;padding:8px;margin:4px 0;border:1px solid var(--b);border-radius:4px}
        body.dark input,body.dark select,body.dark textarea{border-color:#3b82f6;background:rgba(30,41,59,0.8);color:#e2e8f0}
        
        .thread-req{background:var(--g50);padding:12px;border-radius:8px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
        .thread-req-info{font-size:14px}
        .thread-req-btns{display:flex;gap:8px}
        .thread-req-btns button{font-size:12px;padding:6px 12px}
        body.dark .thread-req{background:rgba(59,130,246,0.15);border:1px solid #3b82f6}
        
        .loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:9999}
        .loading-overlay.show{display:flex}
        .loading-box{background:white;padding:30px 50px;border-radius:10px;text-align:center;color:#111}
        .loading-spinner{width:40px;height:40px;border:4px solid #ddd;border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px}
        @keyframes spin{to{transform:rotate(360deg)}}
        body.dark .loading-box{background:#1e293b;color:#fff}
    </style>
</head>
<body>
    <div class="h">
        <h1>АДМИН-ПАНЕЛЬ НИТЕЙ</h1>
        <div style="display:flex;gap:8px">
            <button class="btn" onclick="location.href='dashboard.html'">← Назад</button>
            <button class="btn" onclick="toggleTheme()">🌓</button>
            <button class="btn btn-red" onclick="logout()">Выйти</button>
        </div>
    </div>
    
    <div class="section">
        <h2>Выдать проценты нитей одному игроку</h2>
        <select id="singleUser"><option value="">Выберите игрока</option></select>
        <div style="display:flex;gap:12px;align-items:center;margin:12px 0">
            <label>Энергонить:</label>
            <input type="number" step="0.1" id="threadPercent" value="0" style="width:120px">
            <button class="btn" onclick="giveThreadPercent()">Выдать</button>
        </div>
    </div>
    
    <div class="section">
        <h2>Выдать проценты нитей группе (100% делится)</h2>
        <select id="multiUser" multiple size="6"><option value="">Выберите игроков</option></select>
        <button class="btn" onclick="giveThreadPercentGroup()" style="margin-top:8px">Разделить 100%</button>
    </div>
    
    <div class="section">
        <h2>Передать проценты нитей</h2>
        <select id="fromUser"><option value="">От кого</option></select>
        <select id="toUser"><option value="">Кому</option></select>
        <input type="number" step="0.1" id="transferAmount" placeholder="Сколько %">
        <button class="btn" onclick="transferThreadPercent()" style="margin-top:8px">Передать</button>
    </div>
    
    <div class="section">
        <h2>Остаток нитей</h2>
        <div id="remainderThreads">Загрузка...</div>
    </div>
    
    <div class="section">
        <h2>Запросы на нити</h2>
        <div id="threadRequests">Загрузка...</div>
    </div>
    
    <div class="section">
        <h2>Все игроки</h2>
        <div id="allUsersThreads">Загрузка...</div>
    </div>
    
    <div class="section">
        <h2>Новости</h2>
        <textarea id="newsMessage" placeholder="Введите сообщение..." style="height:100px"></textarea>
        <button class="btn" onclick="postNews()" style="margin-top:8px">Опубликовать</button>
    </div>
    
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-box">
            <div class="loading-spinner"></div>
            <p>Обработка...</p>
        </div>
    </div>
    
    <script>
    const SU = 'https://qjgzhtkpwamounnpgepr.supabase.co';
    const SK = 'sb_publishable_WV7YnhP_OAWYx8gQjOmG1Q_7GdKOVlV';
    let supabaseClient = null;
    let allUsers = [];
    
    async function init() {
        console.log('Админ-панель нитей загружается...');
        if (typeof supabase === 'undefined') { setTimeout(init, 50); return; }
        
        console.log('✅ Supabase загружен, подключение...');
        
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
        
        const user = JSON.parse(localStorage.getItem('session'));
        if (!user) { location.href = 'login.html'; return; }
        
        const allowedRoles = ['admin1.2', 'admin1.3', 'admin2'];
        if (!allowedRoles.includes(user.role)) { location.href = 'login.html'; return; }
        
        supabaseClient = supabase.createClient(SU, SK);
        await loadUsers();
        await loadRemainderThreads();
        await loadThreadRequests();
        await loadAllUsersStats();
    }
    
    function toggleTheme() {
        document.body.classList.toggle('dark');
        localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }
    
    function logout() {
        localStorage.removeItem('session');
        location.href = 'login.html';
    }
    
    function showLoad() { document.getElementById('loadingOverlay').classList.add('show'); }
    function hideLoad() { document.getElementById('loadingOverlay').classList.remove('show'); }
    
    async function loadUsers() {
        const { data } = await supabaseClient.from('users').select('*');
        allUsers = data || [];
        
        const opts = '<option value="">Выберите игрока</option>';
        document.getElementById('singleUser').innerHTML = opts + allUsers.map(u => `<option value="${u.id}">${u.username}</option>`).join('');
        document.getElementById('multiUser').innerHTML = opts + allUsers.map(u => `<option value="${u.id}">${u.username}</option>`).join('');
        document.getElementById('fromUser').innerHTML = '<option value="">От кого</option>' + allUsers.map(u => `<option value="${u.id}">${u.username}</option>`).join('');
        document.getElementById('toUser').innerHTML = '<option value="">Кому</option>' + allUsers.map(u => `<option value="${u.id}">${u.username}</option>`).join('');
    }
    
    async function giveThreadPercent() {
        const userId = document.getElementById('singleUser').value;
        const percent = parseFloat(document.getElementById('threadPercent').value);
        if (!userId || !percent) return alert('Выберите игрока и введите проценты');
        
        showLoad();
        
        const { error } = await supabaseClient.from('stats_threads').insert({
            user_id: userId,
            thread_percent: percent
        });
        
        if (error) {
            console.error('Error:', error);
            alert('Ошибка: ' + error.message);
        } else {
            const admin = JSON.parse(localStorage.getItem('session'));
            const username = allUsers.find(u => u.id === userId)?.username || 'Unknown';
            await supabaseClient.from('audit_log').insert({
                admin_id: admin.id,
                action: 'give_thread_percent',
                details: 'user=' + username + ', amount=' + percent
            });
            
            document.getElementById('threadPercent').value = '0';
            document.getElementById('singleUser').value = '';
        }
        
        hideLoad();
        loadAllUsersStats();
    }
    
    async function giveThreadPercentGroup() {
        const selected = Array.from(document.getElementById('multiUser').selectedOptions).map(o => o.value);
        if (selected.length === 0) return alert('Выберите игроков');
        
        const percent = 100 / selected.length;
        const remainder = 100 - (percent * selected.length);
        showLoad();
        
        for (let userId of selected) {
            await supabaseClient.from('stats_threads').insert({
                user_id: userId,
                thread_percent: percent
            });
        }
        
        const { data: remData } = await supabaseClient.from('remainder').select('*').eq('chunk_name', 'threads').maybeSingle();
        if (remData) {
            await supabaseClient.from('remainder').update({ amount: remainder }).eq('chunk_name', 'threads');
        } else {
            await supabaseClient.from('remainder').insert({ chunk_name: 'threads', amount: remainder });
        }
        
        const admin = JSON.parse(localStorage.getItem('session'));
        await supabaseClient.from('audit_log').insert({
            admin_id: admin.id,
            action: 'give_thread_percent_group',
            details: 'users=' + selected.length + ', amount=' + percent.toFixed(2) + ', remainder=' + remainder.toFixed(2)
        });
        
        hideLoad();
        loadRemainderThreads();
        loadAllUsersStats();
    }
    
    async function transferThreadPercent() {
        const fromId = document.getElementById('fromUser').value;
        const toId = document.getElementById('toUser').value;
        const amount = parseFloat(document.getElementById('transferAmount').value);
        if (!fromId || !toId || !amount) return alert('Заполните все поля');
        if (fromId === toId) return alert('Нельзя передать самому себе');
        
        showLoad();
        
        const { data: fromStats } = await supabaseClient.from('stats_threads').select('thread_percent').eq('user_id', fromId);
        let balance = 0;
        for (let s of (fromStats || [])) balance += s.thread_percent || 0;
        
        if (balance < amount - 0.01) {
            hideLoad();
            document.getElementById('transferAmount').value = '';
            document.getElementById('fromUser').value = '';
            document.getElementById('toUser').value = '';
            alert('❌ Недостаточно процентов для передачи! Максимум: ' + balance.toFixed(1) + '%');
            return;
        }
        
        await supabaseClient.from('transfers_threads').insert({
            from_user_id: fromId,
            to_user_id: toId,
            amount: amount
        });
        
        await supabaseClient.from('stats_threads').insert([
            { user_id: fromId, thread_percent: -amount },
            { user_id: toId, thread_percent: amount }
        ]);
        
        const admin = JSON.parse(localStorage.getItem('session'));
        const fromUser = allUsers.find(u => u.id === fromId)?.username || 'Unknown';
        const toUser = allUsers.find(u => u.id === toId)?.username || 'Unknown';
        await supabaseClient.from('audit_log').insert({
            admin_id: admin.id,
            action: 'transfer_thread_percent',
            details: 'from=' + fromUser + ', to=' + toUser + ', amount=' + amount
        });
        
        document.getElementById('transferAmount').value = '';
        document.getElementById('fromUser').value = '';
        document.getElementById('toUser').value = '';
        
        hideLoad();
        loadAllUsersStats();
    }
    
    async function loadRemainderThreads() {
        const { data, error } = await supabaseClient.from('remainder').select('*').eq('chunk_name', 'threads').maybeSingle();
        if (error || !data) {
            document.getElementById('remainderThreads').innerHTML = '<strong>Остаток нитей: ?%</strong>';
            return;
        }
        const remainder = data.amount || 0;
        document.getElementById('remainderThreads').innerHTML = `<strong>Остаток нитей: ${remainder.toFixed(1)}%</strong>`;
    }
    
    async function loadThreadRequests() {
        const { data: reqs, error } = await supabaseClient.from('thread_requests').select('*').eq('status', 'pending');
        
        if (error) {
            console.error('Error loading requests:', error);
            document.getElementById('threadRequests').innerHTML = 'Ошибка загрузки';
            return;
        }
        
        if (!reqs || reqs.length === 0) {
            document.getElementById('threadRequests').innerHTML = 'Нет запросов';
            return;
        }
        
        let html = '';
        for (let req of reqs) {
            const username = allUsers.find(u => u.id === req.user_id)?.username || 'Неизвестно';
            html += `<div class="thread-req">
                <div class="thread-req-info"><strong>${username}</strong> - запросил нить</div>
                <div class="thread-req-btns">
                    <button class="btn" onclick="approveThreadReq('${req.id}', '${req.user_id}')">✓</button>
                    <button class="btn btn-red" onclick="rejectThreadReq('${req.id}', '${req.user_id}')">✗</button>
                </div>
            </div>`;
        }
        document.getElementById('threadRequests').innerHTML = html;
    }
    
    async function approveThreadReq(reqId, userId) {
        showLoad();
        
        const username = allUsers.find(u => u.id === userId)?.username || 'Unknown';
        
        await supabaseClient.from('thread_requests').update({ status: 'approved' }).eq('id', reqId);
        await supabaseClient.from('issued_threads').insert({ user_id: userId });
        await supabaseClient.from('stats_threads').insert({
            user_id: userId,
            thread_percent: -100
        });
        
        const admin = JSON.parse(localStorage.getItem('session'));
        await supabaseClient.from('audit_log').insert({
            admin_id: admin.id,
            action: 'approve_thread_request',
            details: 'user=' + username
        });
        
        hideLoad();
        loadThreadRequests();
        loadAllUsersStats();
    }
    
    async function rejectThreadReq(reqId, userId) {
        showLoad();
        
        const username = allUsers.find(u => u.id === userId)?.username || 'Unknown';
        
        await supabaseClient.from('thread_requests').update({ status: 'rejected' }).eq('id', reqId);
        
        const admin = JSON.parse(localStorage.getItem('session'));
        await supabaseClient.from('audit_log').insert({
            admin_id: admin.id,
            action: 'reject_thread_request',
            details: 'user=' + username
        });
        
        hideLoad();
        loadThreadRequests();
    }
    
    async function loadAllUsersStats() {
        let html = '<table><thead><tr><th>Игрок</th><th>Энергонить</th></tr></thead><tbody>';
        
        for (let u of allUsers) {
            const { data } = await supabaseClient.from('stats_threads').select('thread_percent').eq('user_id', u.id);
            let total = 0;
            for (let x of (data || [])) total += x.thread_percent || 0;
            html += `<tr><td>${u.username}</td><td>${total.toFixed(1)}%</td></tr>`;
        }
        html += '</tbody></table>';
        document.getElementById('allUsersThreads').innerHTML = html;
    }
    
    async function postNews() {
        const msg = document.getElementById('newsMessage').value.trim();
        if (!msg) return;
        
        const user = JSON.parse(localStorage.getItem('session'));
        await supabaseClient.from('news').insert({ author_id: user.id, message: msg, role: user.role });
        
        document.getElementById('newsMessage').value = '';
        alert('Новость опубликована!');
    }
    
    window.onload = init;
    </script>
</body>
</html>
