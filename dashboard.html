<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAZZERS</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--g:#16a34a;--g2:#15803d;--g100:#dcfce7;--g50:#f0fdf4;--w:#fff;--gray:#111;--b:#bbf7d0;--bulldozer:#f59e0b;--caravan:#4ade80;--newland:#3b82f6;--core:#ef4444}
        
        /* Красивый скроллбар */
        ::-webkit-scrollbar{width:10px;height:10px}
        ::-webkit-scrollbar-track{background:rgba(0,0,0,0.1);border-radius:5px}
        ::-webkit-scrollbar-thumb{background:var(--g);border-radius:5px}
        ::-webkit-scrollbar-thumb:hover{background:var(--g2)}
        body{background:url('static/images/light-bg.jpg') fixed;background-size:cover;font-family:Arial,sans-serif;color:var(--gray);min-height:100vh}
        .h{display:flex;align-items:center;padding:16px;background:rgba(255,255,255,0.92);border-bottom:2px solid var(--g);gap:12px;flex-wrap:wrap}
        .logo{font-weight:700;font-size:24px;color:var(--g);border:2px solid var(--g);padding:5px 12px;border-radius:8px;background:var(--g50)}
        .nav{flex:1;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
        .nav button{background:0;border:0;color:var(--g);font-weight:600;font-size:14px;cursor:pointer;padding:6px 10px;border-radius:6px;min-width:100px}
        .nav button:hover{background:var(--g50)}
        .out{margin-left:auto;color:#ef4444;background:0;border:0;font-weight:600;cursor:pointer;font-size:14px}
        .m{height:calc(100vh - 70px);display:flex;justify-content:center;align-items:center}
        
        .modal{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.3);z-index:1000;justify-content:center;align-items:center;backdrop-filter:blur(2px)}
        .modal.open{display:flex}
        .modal-content{background:rgba(255,255,255,0.95);border:2px solid var(--g);border-radius:16px;width:94%;max-width:1200px;max-height:90vh;overflow-y:auto;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,0.15)}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--b)}
        .modal-title{font-size:20px;font-weight:700;color:var(--g)}
        .close-btn{background:var(--g);color:white;width:32px;height:32px;border:0;border-radius:50%;font-weight:bold;cursor:pointer}
        
        table{width:100%;border-collapse:collapse;margin:12px 0}
        th,td{padding:11px 8px;text-align:center;border:1px solid var(--b);font-size:13px}
        th{background:var(--g100)}
        
        .s{background:var(--g50);padding:16px;border-radius:12px;margin-top:16px;border:1px solid var(--b)}
        .s h3{font-size:16px;color:var(--g2);margin-bottom:12px}
        
        .profile{position:fixed;top:0;right:0;height:100vh;width:320px;background:rgba(255,255,255,0.95);border-left:2px solid var(--g);padding:24px;z-index:1001;display:none}
        .profile.open{display:block}
        
        .theme-btn{position:fixed;bottom:20px;right:20px;padding:8px 16px;background:var(--g);color:white;border:0;border-radius:6px;cursor:pointer}
        
        .overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.2);z-index:999;display:none}
        .overlay.open{display:block}
        
        /* DARK THEME */
        body.dark{background:url('static/images/dark-bg.jpg') fixed;background-size:cover;color:#e2e8f0}
        body.dark .h{background:rgba(15,23,42,0.95)}
        body.dark .logo{color:#4ade80;border-color:#4ade80;background:rgba(74,222,128,0.1)}
        body.dark .nav button{color:#4ade80}
        body.dark .nav button:hover{background:rgba(74,222,128,0.2)}
        body.dark .modal-content{background:rgba(15,23,42,0.95)}
        body.dark .modal-header{border-color:#4ade80}
        body.dark .modal-title{color:#4ade80}
        body.dark .close-btn{background:#4ade80;color:#0f172a}
        body.dark th,body.dark td{border-color:#4ade80}
        body.dark th{background:rgba(74,222,128,0.15);color:#fff;font-weight:bold}
        body.dark table tbody tr:last-child{background:rgba(74,222,128,0.25)}
        
        body.dark .s{background:rgba(74,222,128,0.1);border-color:#4ade80}
        body.dark .s h3{color:#4ade80}
        body.dark .profile{background:rgba(15,23,42,0.95);border-color:#4ade80}
        body.dark #playerName{color:#fff;font-size:32px;font-weight:bold}
        
        /* Тёмные цвета столбцов в.dark */
        body.dark th[style*="bulldozer"]{background:#c77a00 !important}
        body.dark th[style*="caravan"]{background:#3aba68 !important}
        body.dark th[style*="newland"]{background:#2d6bc4 !important}
        body.dark th[style*="core"]{background:#cc3333 !important}
        
        /* Новости в тёмной теме */
        body.dark .news-item{background:rgba(30,41,59,0.9) !important;border-color:#4ade80 !important}
        body.dark .news-item .author{color:#4ade80 !important}
        body.dark .news-item .message{color:#fff !important}
        body.dark .news-item .date{color:#94a3b8 !important}
        
        /* Цветные полоски для новостей */
        .news-item{border-left:4px solid transparent}
        .news-admin{border-left-color:#ef4444 !important}
        .news-admin2{border-left-color:#eab308 !important}
        
        body.dark .news-admin{border-left-color:#ef4444 !important}
        body.dark .news-admin2{border-left-color:#eab308 !important}
    </style>
</head>
<body>
    <div class="h">
        <div class="logo">BRAZZERS</div>
        <div class="nav">
            <button onclick="openModal('stats')">📊 Статистика</button>
            <button onclick="openModal('common')">📋 Общая таблица</button>
            <button onclick="openModal('news')">📰 Новости</button>
            <button onclick="toggleProfile()">👤 Профиль</button>
        </div>
        <button class="out" onclick="logout()">🚪 Выйти</button>
    </div>
    <div class="m"></div>
    
    <!-- Статистика -->
    <div id="stats-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Статистика игрока</div>
                <button class="close-btn" onclick="closeModal('stats')">×</button>
            </div>
            <div class="player-info" id="playerName" style="font-size:24px;margin-bottom:16px;font-weight:bold">Игрок: ...</div>
            <div class="table-container" id="statsTable"></div>
            <div style="display:grid;grid-template-columns:1fr 1fr 2fr;gap:12px;margin-top:12px">
                <div class="s" id="sixB13Info" style="margin:0">Полученных 6б13: 0</div>
                <div class="s" id="givenInfo" style="margin:0">Отданных процентов: 0%</div>
                <div class="s" style="margin:0">
                    <h3 style="font-size:14px;margin-bottom:8px">Запросить кусок</h3>
                    <div id="requestBtns" style="display:flex;flex-wrap:wrap;gap:6px"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Общая -->
    <div id="common-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Общая статистика</div>
                <button class="close-btn" onclick="closeModal('common')">×</button>
            </div>
            <div class="table-container" id="commonTable"></div>
        </div>
    </div>
    
    <!-- Новости -->
    <div id="news-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Новости</div>
                <button class="close-btn" onclick="closeModal('news')">×</button>
            </div>
            <div id="newsList"></div>
        </div>
    </div>
    
    <!-- Профиль -->
    <div class="overlay" onclick="closeAll()"></div>
    <div class="profile" id="profile">
        <div class="modal-header">
            <div class="modal-title">Ваш профиль</div>
            <button class="close-btn" onclick="toggleProfile()">×</button>
        </div>
        <div class="s"><span>Логин: </span><span id="profileLogin">-</span></div>
        <div class="s"><span>Роль: </span><span id="profileRole">-</span></div>
        <div id="requestChange" class="s" style="display:none;">
            <h3>Сменить данные</h3>
            <input id="newLogin" placeholder="Новый логин" style="width:100%;padding:8px;margin:4px 0">
            <input id="newPass" type="password" placeholder="Новый пароль" style="width:100%;padding:8px;margin:4px 0">
            <button onclick="reqChange()" style="background:var(--g);color:white;border:0;padding:8px 16px;border-radius:6px;cursor:pointer">Отправить</button>
        </div>
        <div id="adminBtnContainer">
            <div id="adminBtns"></div>
        </div>
    </div>
    
    <button class="theme-btn" onclick="toggleTheme()">🌓 Тема</button>
    
    <script>
    console.log('🚀 Скрипт Started');
    console.log('🚀 Главная страница загружена');
    const SU = 'https://qjgzhtkpwamounnpgepr.supabase.co';
    const SK = 'sb_publishable_WV7YnhP_OAWYx8gQjOmG1Q_7GdKOVlV';
    const CH = ['chunk1','chunk2','chunk3','chunk4','chunk5','chunk6','chunk7','chunk8','vr1','vr2','vr3','core'];
    const C_LABELS = {chunk1:'Кусок1',chunk2:'Кусок2',chunk3:'Кусок3',chunk4:'Кусок4',chunk5:'Кусок5',chunk6:'Кусок6',chunk7:'Кусок7',chunk8:'Кусок8',vr1:'В.Рад1',vr2:'В.Рад2',vr3:'В.Рад3',core:'Ядро'};
    let user = null, s = null;
    
    function init() {
        console.log('⏳ Инициализация...');
        if (typeof supabase === 'undefined') { setTimeout(init, 50); return; }
        s = supabase.createClient(SU, SK);
        console.log('✅ Подключено');
        
        user = JSON.parse(localStorage.getItem('session'));
        if (!user) { console.log('❌ Нет сессии'); location.href = 'login.html'; return; }
        console.log('✅ Сессия:', user.username);
        
        document.getElementById('playerName').textContent = 'Игрок: ' + user.username;
        document.getElementById('profileLogin').textContent = user.login;
        document.getElementById('profileRole').textContent = user.role;
        
        if (user.role === 'user') document.getElementById('requestChange').style.display = 'block';
        
        let adminBtns = '';
        if (user.role === 'admin') {
            adminBtns = '<button onclick="goAdmin()" style="width:100%;margin-top:16px;padding:10px;background:var(--g);color:white;border:0;border-radius:6px;cursor:pointer;font-weight:600">Админ-панель</button>';
        } else if (user.role === 'admin2') {
            adminBtns = '<button onclick="goAdmin2()" style="width:100%;margin-top:16px;padding:10px;background:var(--g);color:white;border:0;border-radius:6px;cursor:pointer;font-weight:600">Админ-панель</button>';
            adminBtns += '<button onclick="goTech()" style="width:100%;margin-top:8px;padding:10px;background:var(--g);color:white;border:0;border-radius:6px;cursor:pointer;font-weight:600">Тех. режим</button>';
        }
        document.getElementById('adminBtns').innerHTML = adminBtns;
        
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
        
        loadStats();
    }
    
async function loadStats() {
        console.log('📊 Загрузка статистики...');
        
        // Получаем все записи для подсчёта total
        const { data: allData, error } = await s.from('stats').select('*').eq('user_id', user.id);
        console.log('stats response:', allData, 'error:', error);
        
        if (error) {
            console.error('Ошибка загрузки stats:', error);
            document.getElementById('statsTable').innerHTML = '<p style="color:red">Ошибка загрузки: ' + error.message + '</p>';
            return;
        }
        
        // Считаем total из ВСЕХ записей в БД
        let t = {}; for (let c of CH) t[c] = 0;
        for (let x of (allData || [])) for (let c of CH) t[c] += x[c] || 0;
        
        // Показываем только последние 10 записей (новые внизу)
        const displayData = (allData || []).slice(-10);
        
        let h = '<table><thead><tr><th rowspan=2>Дата</th><th colspan=3 style="background:var(--bulldozer);color:white">Бульдозер</th><th colspan=4 style="background:var(--caravan);color:#111">Караван</th><th colspan=4 style="background:var(--newland);color:white">Новая Земля</th><th rowspan=2 style="background:var(--core);color:white">Ядро</th></tr><tr><th style="background:var(--bulldozer);color:white">1</th><th style="background:var(--bulldozer);color:white">2</th><th style="background:var(--bulldozer);color:white">ВР1</th><th style="background:var(--caravan);color:#111">3</th><th style="background:var(--caravan);color:#111">4</th><th style="background:var(--caravan);color:#111">5</th><th style="background:var(--caravan);color:#111">ВР2</th><th style="background:var(--newland);color:white">6</th><th style="background:var(--newland);color:white">7</th><th style="background:var(--newland);color:white">8</th><th style="background:var(--newland);color:white">ВР3</th></tr></thead><tbody>';
        for (let x of displayData) {
            h += '<tr><td>' + (x.created_at || x.updated_at || '').slice(0,16) + '</td>';
            for (let c of CH) h += '<td>' + (x[c]||0).toFixed(1) + '</td>';
            h += '</tr>';
        }
        h += '<tr><td><strong>Всего</strong></td>';
        for (let c of CH) h += '<td>' + t[c].toFixed(1) + '</td>';
        h += '</tr></tbody></table>';
        document.getElementById('statsTable').innerHTML = h;
        
        // Создаём кнопки запроса кусков
        let btns = '';
        for (let c of CH) {
            if (t[c] >= 100) btns += '<button onclick="reqChunk(\''+c+'\')" style="background:var(--g);color:white;border:0;padding:4px 8px;border-radius:4px;cursor:pointer;margin:2px;font-size:12px">'+C_LABELS[c]+'</button>';
        }
        document.getElementById('requestBtns').innerHTML = btns || '<span style="color:#888;font-size:12px">Нет кусков для запроса</span>';
        
        // Считаем 6Б13 из таблицы issued_chunks
        const { data: issued, error: issuedError } = await s.from('issued_chunks').select('chunk_name').eq('user_id', user.id);
        let counts = {};
        for (let c of CH) counts[c] = 0;
        for (let x of (issued || [])) {
            if (counts[x.chunk_name] !== undefined) counts[x.chunk_name]++;
        }
        let sixB13 = 999999;
        for (let c of CH) {
            if (counts[c] < sixB13) sixB13 = counts[c];
        }
        if (sixB13 === 999999) sixB13 = 0;
        document.getElementById('sixB13Info').textContent = 'Полученных 6б13: ' + sixB13;
        
        // Считаем отданные проценты из transfers
        const { data: transfers } = await s.from('transfers').select('amount').eq('from_user_id', user.id);
        let given = 0;
        for (let tr of (transfers || [])) given += tr.amount || 0;
        document.getElementById('givenInfo').textContent = 'Отданных процентов: ' + given.toFixed(1) + '%';
    }
    
async function loadCommon() {
        console.log('📋 Загрузка общей таблицы...');
        document.getElementById('commonTable').innerHTML = '<div style="text-align:center;padding:40px">⏳ Загрузка...</div>';
        
        const { data: users } = await s.from('users').select('*');
        
        let h = '<table><thead><tr><th rowspan=2>Никнейм</th><th colspan=3 style="background:var(--bulldozer);color:white">Бульдозер</th><th colspan=4 style="background:var(--caravan);color:#111">Караван</th><th colspan=4 style="background:var(--newland);color:white">Новая Земля</th><th rowspan=2 style="background:var(--core);color:white">Ядро</th></tr><tr><th style="background:var(--bulldozer);color:white">1</th><th style="background:var(--bulldozer);color:white">2</th><th style="background:var(--bulldozer);color:white">ВР1</th><th style="background:var(--caravan);color:#111">3</th><th style="background:var(--caravan);color:#111">4</th><th style="background:var(--caravan);color:#111">5</th><th style="background:var(--caravan);color:#111">ВР2</th><th style="background:var(--newland);color:white">6</th><th style="background:var(--newland);color:white">7</th><th style="background:var(--newland);color:white">8</th><th style="background:var(--newland);color:white">ВР3</th></tr></thead><tbody>';
        
        for (let u of (users || [])) {
            const { data } = await s.from('stats').select('*').eq('user_id', u.id);
            h += '<tr><td>' + u.username + '</td>';
            for (let c of CH) {
                let val = 0;
                for (let x of (data || [])) val += x[c] || 0;
                h += '<td>' + val.toFixed(1) + '</td>';
            }
            h += '</tr>';
        }
        h += '</tbody></table>';
        document.getElementById('commonTable').innerHTML = h;
        console.log('✅ Общая таблица загружена');
    }
    
    async function loadNews() {
        console.log('📰 Загрузка новостей...');
        document.getElementById('newsList').innerHTML = '<div style="text-align:center;padding:40px">⏳ Загрузка...</div>';
        
        const { data: news } = await s.from('news').select('*').order('created_at', { ascending: false });
        const { data: users } = await s.from('users').select('*');
        
        let usersMap = {};
        for (let u of (users || [])) usersMap[u.id] = u;
        
        if (!news || news.length === 0) {
            document.getElementById('newsList').innerHTML = '<div style="text-align:center;padding:40px;color:#888">📭 На данный момент новостей нету, в скором времени они появятся.</div>';
            return;
        }
        
        let h = '';
        for (let n of news) {
            let author = usersMap[n.author_id] || { username: 'Unknown' };
            let newsClass = n.role === 'admin2' ? 'news-admin2' : 'news-admin';
            h += '<div class="news-item ' + newsClass + '" style="background:var(--g50);padding:12px;border-radius:8px;margin-bottom:12px">';
            h += '<div class="author" style="font-weight:bold;color:var(--g2);margin-bottom:6px">' + author.username + '</div>';
            h += '<div class="message" style="white-space:pre-wrap;line-height:1.4">' + n.message + '</div>';
            h += '<div class="date" style="font-size:12px;color:#666;margin-top:6px">' + (n.created_at || '').slice(0, 16) + '</div>';
            h += '</div>';
        }
        document.getElementById('newsList').innerHTML = h;
        console.log('✅ Новости загружены');
    }
    
    function openModal(name) { console.log('📂 Открыть:', name); document.getElementById(name + '-modal').classList.add('open'); if(name === 'common') loadCommon(); if(name === 'news') loadNews(); }
    function closeModal(name) { console.log('📕 Закрыть:', name); document.getElementById(name + '-modal').classList.remove('open'); }
    function toggleProfile() { console.log('👤 Профиль'); let p = document.getElementById('profile'); p.classList.toggle('open'); document.querySelector('.overlay').classList.toggle('open'); }
    function closeAll() { console.log('❌ Закрыть всё'); document.querySelectorAll('.modal').forEach(m => m.classList.remove('open')); document.getElementById('profile').classList.remove('open'); document.querySelector('.overlay').classList.remove('open'); }
    function toggleTheme() { console.log('🌓 Тема'); document.body.classList.toggle('dark'); localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light'); }
    function logout() { console.log('🚪 Выход'); localStorage.removeItem('session'); location.href = 'login.html'; }
    function goAdmin() { console.log('➡️ Админ'); location.href = 'admin.html'; }
    function goAdmin2() { console.log('➡️ Админ2'); location.href = 'admin.html'; }
    function goTech() { console.log('➡️ Тех'); location.href = 'tech.html'; }
    async function reqChange() {
        let nl = document.getElementById('newLogin').value.trim();
        let np = document.getElementById('newPass').value.trim();
        if (!nl && !np) return;
        
        // Показываем overlay
        document.querySelector('.overlay').classList.add('open');
        
        try {
            let insertData = { user_id: user.id, status: 'pending' };
            if (nl) insertData.new_login = nl;
            if (np) insertData.new_password_hash = btoa(np);
            
            console.log('Отправка заявки:', insertData);
            const { error } = await s.from('change_requests').insert(insertData);
            
            if (error) {
                console.error('Ошибка при отправке:', error);
                alert('Ошибка: ' + error.message);
            } else {
                // Очищаем поля
                document.getElementById('newLogin').value = '';
                document.getElementById('newPass').value = '';
                alert('✅ Заявка отправлена!');
            }
        } catch(e) {
            console.error('Ошибка:', e);
            alert('Ошибка: ' + e.message);
        }
        
        document.querySelector('.overlay').classList.remove('open');
    }
    
    async function reqChunk(chunk) {
        console.log('📦 Запрос куска:', chunk);
        let t = {};
        const { data } = await s.from('stats').select('*').eq('user_id', user.id);
        for (let x of (data || [])) for (let c of CH) t[c] = (t[c]||0) + (x[c]||0);
        if ((t[chunk]||0) < 100) return;
        
        let vals = {}; for (let c of CH) vals[c] = 0;
        vals[chunk] = -100;
        await s.from('stats').insert({ user_id: user.id, ...vals });
        await s.from('chunk_requests').insert({ user_id: user.id, chunk_name: chunk, status: 'pending' });
        loadStats();
    }
    
    // Запускаем когда страница загрузится
    window.onload = function() {
        console.log('🏠 Страница загружена, запускаем init...');
        init();
    };
    </script>
</body>
</html>
