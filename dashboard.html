<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAZZERS</title>
    <link rel="preconnect" href="https://unpkg.com">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#f0fdf4;min-height:100vh}
        .h{display:flex;align-items:center;padding:16px;background:white;border-bottom:2px solid #16a34a;gap:12px;flex-wrap:wrap}
        .logo{font-weight:700;font-size:24px;color:#16a34a;border:2px solid #16a34a;padding:5px 12px;border-radius:8px}
        .nav{flex:1;display:flex;gap:8px;justify-content:center}
        .nav button{background:0;border:0;color:#16a34a;font-weight:600;cursor:pointer;padding:6px 12px}
        .out{color:#ef4444;background:0;border:0;font-weight:600;cursor:pointer}
        .m{padding:20px}
        .s{background:white;border-radius:12px;padding:16px;margin-bottom:16px;border:1px solid #bbf7d0}
        .s h2{color:#16a34a;margin:0 0 12px}
        table{width:100%;border-collapse:collapse}
        th,td{padding:8px;text-align:center;border:1px solid #bbf7d0}
        th{background:#dcfce7}
    </style>
</head>
<body>
    <div class="h">
        <div class="logo">BRAZZERS</div>
        <div class="nav">
            <button onclick="loadStats()">📊 Статистика</button>
            <button onclick="loadCommon()">📋 Общая</button>
            <button onclick="loadNews()">📰 Новости</button>
        </div>
        <button class="out" onclick="logout()">🚪 Выйти</button>
    </div>
    <div class="m">
        <div class="s">
            <h2 id="w">Привет!</h2>
            <div id="st">Загрузка...</div>
        </div>
        <div class="s" id="as" style="display:none;">
            <h2>Админ-панель</h2>
            <button onclick="goAdmin()" style="background:#16a34a;color:white;border:0;padding:8px 16px;border-radius:6px;cursor:pointer">Перейти</button>
        </div>
    </div>
    <script>
    console.log('🚀 Dashboard запущен');
    const SU = 'https://qjgzhtkpwamounnpgepr.supabase.co';
    const SK = 'sb_publishable_WV7YnhP_OAWYx8gQjOmG1Q_7GdKOVlV';
    const CH = ['chunk1','chunk2','chunk3','chunk4','chunk5','chunk6','chunk7','chunk8','vr1','vr2','vr3','core'];
    
    function init() {
        console.log('⏳ Инициализация...');
        if (typeof supabase === 'undefined') { setTimeout(init, 50); return; }
        console.log('✅ Supabase готов');
        
        const s = supabase.createClient(SU, SK);
        console.log('🔗 Подключено');
        
        const ss = JSON.parse(localStorage.getItem('session'));
        if (!ss) { console.log('❌ Нет сессии'); location.href = 'login.html'; return; }
        console.log('✅ Сессия есть:', ss.username);
        
        document.getElementById('w').textContent = 'Привет, ' + ss.username + '!';
        if (ss.role === 'admin' || ss.role === 'admin2') document.getElementById('as').style.display = 'block';
        
        loadStatsData(s, ss);
    }
    
    async function loadStatsData(s, ss) {
        console.log('📊 Загрузка статистики...');
        const { data } = await s.from('stats').select('*').eq('user_id', ss.id);
        let t = {};
        for (let c of CH) t[c] = 0;
        for (let x of (data || [])) for (let c of CH) t[c] += x[c] || 0;
        
        let h = '<table><tr><th>Ку��ок</th><th>%</th></tr>';
        for (let c of CH) h += '<tr><td>' + c + '</td><td>' + t[c].toFixed(1) + '%</td></tr>';
        h += '</table>';
        document.getElementById('st').innerHTML = h;
        console.log('✅ Статистика загружена');
    }
    
    function loadStats() { console.log('📊 Нажата статистика'); init(); }
    function loadCommon() { console.log('📋 Нажата общая'); location.reload(); }
    function loadNews() { console.log('📰 Нажаты новости'); alert('Новости'); }
    function goAdmin() { console.log('➡️ Админ'); const ss = JSON.parse(localStorage.getItem('session')); location.href = ss.role === 'admin2' ? 'tech.html' : 'admin.html'; }
    function logout() { console.log('🚪 Выход'); localStorage.removeItem('session'); location.href = 'login.html'; }
    
    init();
    </script>
</body>
</html>
