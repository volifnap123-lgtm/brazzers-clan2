<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAZZERS</title>
    <style>
        body{font-family:Arial,background:#f0fdf4;margin:0;padding:0}
        .h{display:flex;align-items:center;padding:16px;background:rgba(255,255,255,0.95);border-bottom:2px solid #16a34a;gap:12px}
        .logo{font-weight:700;font-size:24px;color:#16a34a;border:2px solid #16a34a;padding:5px 12px;border-radius:8px}
        .nav{flex:1;display:flex;gap:8px;justify-content:center}
        .nav button{background:0;border:0;color:#16a34a;font-weight:600;font-size:14px;cursor:pointer;padding:6px 12px;border-radius:6px}
        .nav button:hover{background:#dcfce7}
        .out{color:#ef4444;background:0;border:0;font-weight:600;cursor:pointer}
        .m{padding:20px}
        .s{background:white;border-radius:12px;padding:16px;margin-bottom:16px;border:1px solid #bbf7d0}
        .s h2{color:#16a34a;margin:0 0 12px 0}
        table{width:100%;border-collapse:collapse}
        th,td{padding:8px;text-align:center;border:1px solid #bbf7d0}
        th{background:#dcfce7}
        .btn{background:#16a34a;color:white;border:0;padding:8px 16px;border-radius:6px;font-weight:600;cursor:pointer}
    </style>
</head>
<body>
    <div class="h">
        <div class="logo">BRAZZERS</div>
        <div class="nav">
            <button onclick="location.reload()">📊 Статистика</button>
            <button onclick="loadC()">📋 Общая</button>
            <button onclick="loadN()">📰 Новости</button>
        </div>
        <button class="out" onclick="logout()">🚪 Выйти</button>
    </div>
    <div class="m">
        <div class="s">
            <h2 id="w">Добро пожаловать!</h2>
            <div id="st">Загрузка...</div>
        </div>
        <div class="s" id="as" style="display:none;">
            <h2>Админ</h2>
            <button class="btn" onclick="goA()">Перейти</button>
        </div>
    </div>
    <script>
    const SU='https://qjgzhtkpwamounnpgepr.supabase.co';
    const SK='sb_publishable_WV7YnhP_OAWYx8gQjOmG1Q_7GdKOVlV';
    const CH=['chunk1','chunk2','chunk3','chunk4','chunk5','chunk6','chunk7','chunk8','vr1','vr2','vr3','core'];
    const s=supabase.createClient(SU,SK);
    let u=null;
    async function init(){
        let ss=JSON.parse(localStorage.getItem('session'));
        if(!ss){location.href='login.html';return}
        u=ss;document.getElementById('w').textContent='Привет, '+u.username+'!';
        if(u.role==='admin'||u.role==='admin2')document.getElementById('as').style.display='block';
        let{d}=await s.from('stats').select('*').eq('user_id',u.id);
        let t=[];for(let c of CH)t[c]=0;
        for(let x of(d||[]))for(let c of CH)t[c]+=x[c]||0;
        let h='<table><tr><th>Кусок</th><th>%</th></tr>';
        for(let c of CH)h+='<tr><td>'+c+'</td><td>'+t[c].toFixed(1)+'</td></tr>';
        h+='</table>';document.getElementById('st').innerHTML=h;
    }
    async function loadC(){let{data}=await s.from('users').select('*');alert('Юзеров: '+(data||[]).length)}
    async function loadN(){let{data}=await s.from('news').select('*').order('created_at',{ascending:false});alert(data&&data[0]?data[0].message:'Нет')}
    function goA(){location.href=u.role==='admin2'?'tech.html':'admin.html'}
    function logout(){localStorage.removeItem('session');location.href='login.html'}
    init();
    </script>
</body>
</html>
